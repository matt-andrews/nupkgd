[package]
name = "nupkgd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
roxmltree = "0.21"
zip = "8.6"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["macros"] }
utoipa = "5.5"
serde = { version = "1.0", features = ["derive"] }
fuzzy-matcher = "0.3"
notify = "8.0"
walkdir = "2.5"
[dev-dependencies]
serde_json = "1.0"
