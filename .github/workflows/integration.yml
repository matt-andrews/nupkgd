name: Integration tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tempest:
    name: Tempest against nupkgd
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Tempest integration suite
        run: bash tempest/run.sh
