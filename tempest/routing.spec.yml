name: "Routing edges"
description: "Unknown paths, unsupported methods and the absence of write endpoints"

describe:
  - name: "Unknown paths return 404"
    describe:
      - name: "GET /nope"
        test:
          route: /nope
          assert:
            - status == 404
      - name: "GET /v3/nope.json"
        test:
          route: /v3/nope.json
          assert:
            - status == 404
      - name: "GET /v3/package/ (no id)"
        test:
          route: /v3/package/
          assert:
            - status == 404

  - name: "Unsupported methods on known routes return 405"
    describe:
      - name: "POST /v3/index.json"
        test:
          route: /v3/index.json
          verb: POST
          body: "{}"
          headers:
            Content-Type: application/json
          assert:
            - status == 405
      - name: "PUT /v3/search"
        test:
          route: /v3/search
          verb: PUT
          body: "q=widget"
          assert:
            - status == 405
      - name: "DELETE a package"
        test:
          route: /v3/package/test.ex.pkg/1.3.4/test.ex.pkg.1.3.4.nupkg
          verb: DELETE
          assert:
            - status == 405
      - name: "PATCH a registration leaf"
        test:
          route: /v3/registration/test.ex.pkg/1.3.4.json
          verb: PATCH
          body: "{}"
          assert:
            - status == 405

  - name: "NuGet write endpoints do not exist"
    describe:
      - name: "PUT /api/v2/package (push)"
        test:
          route: /api/v2/package
          verb: PUT
          body: "not a package"
          headers:
            X-NuGet-ApiKey: irrelevant
          assert:
            - status == 404
      - name: "DELETE /api/v2/package/{id}/{version} (unlist)"
        test:
          route: /api/v2/package/test.ex.pkg/1.3.4
          verb: DELETE
          headers:
            X-NuGet-ApiKey: irrelevant
          assert:
            - status == 404
      - name: "PUT /api/v2/symbolpackage"
        test:
          route: /api/v2/symbolpackage
          verb: PUT
          body: "not a package"
          assert:
            - status == 404
